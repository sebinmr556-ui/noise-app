<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Noise • Social</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',sans-serif}
:root{--bg:#ffffff;--ink:#000000;--muted:#737373;--line:#dbdbdb;--pink:#ff2d55;--tint:#fafafa}
body{background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app-container{width:100%;max-width:470px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:60px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

/* Header */
.header{height:54px;padding:0 16px;background:#ffffff;position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.app-logo{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.header-right{display:flex;align-items:center;gap:15px}
.header-icon-btn{background:none;border:0;font-size:22px}
.login-btn{background:var(--ink);color:#fff;border:0;padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600}

/* Sections */
.page-section{display:none;padding-bottom:30px;animation:fadeIn .2s}
.page-section.active{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* Stories Bar */
.stories-bar{display:flex;gap:12px;padding:10px 15px;overflow-x:auto;border-bottom:1px solid var(--line);background:#fff;scrollbar-width:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;cursor:pointer}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)}
.story-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story-name{font-size:11px;color:var(--ink);width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Post Card */
.post-card{background:#fff;border-bottom:1px solid var(--line);margin-bottom:12px}
.post-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.post-user-wrap{display:flex;align-items:center;gap:10px}
.avatar{width:32px;height:32px;border-radius:50%;object-fit:cover}
.post-image{width:100%;max-height:500px;object-fit:cover;display:block;background:#000}
.post-actions{padding:10px 14px 6px;display:flex;justify-content:space-between}
.post-actions-left{display:flex;gap:14px}
.action-btn{background:none;border:0;font-size:24px;line-height:1}
.action-btn.liked{color:var(--pink)}
.post-likes{padding:0 14px 4px;font-size:13px;font-weight:600}
.post-caption{padding:0 14px 12px;font-size:13px;overflow-wrap:anywhere;line-height:1.4}
.post-caption strong{margin-right:6px;font-weight:600}

/* Profile Instagram Style */
.profile-header-ig{padding:15px 16px 10px}
.profile-top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.profile-ig-pic{width:82px;height:82px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#eee}
.profile-stats{display:flex;flex:1;justify-content:space-around;text-align:center}
.stat-num{font-size:16px;font-weight:700}
.stat-label{font-size:11px;color:var(--muted)}
.profile-bio-section{padding:0 4px 12px}
.profile-bio-section h3{font-size:14px;font-weight:600}
.profile-bio-section p{font-size:13px;color:var(--muted);margin-top:2px}
.profile-actions-row{display:flex;gap:6px;margin-bottom:15px}
.ig-btn{flex:1;background:#efefef;border:0;padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink)}

/* Profile Grid Tabs */
.profile-tabs{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.profile-tab{flex:1;text-align:center;padding:12px;font-size:16px;color:var(--muted);cursor:pointer;border-bottom:1px solid transparent}
.profile-tab.active{color:var(--ink);border-bottom-color:var(--ink)}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line)}
.grid-item{aspect-ratio:1;background:#fff;overflow:hidden}
.grid-item img{width:100%;height:100%;object-fit:cover}

/* Upload Page */
.upload-wrapper{padding:16px}
.upload-area{width:100%;height:280px;background:var(--tint);border:2px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:8px;margin-bottom:15px;cursor:pointer;overflow:hidden}
.upload-area img{width:100%;height:100%;object-fit:cover}
.upload-form input, .upload-form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--tint);outline:none;margin-bottom:12px}
.btn-ig{width:100%;padding:10px;background:#0095f6;color:white;border:0;border-radius:8px;font-size:14px;font-weight:600}
#upload-progress-container{display:none;margin-bottom:12px;background:#efefef;border-radius:8px;padding:10px;text-align:center}
.progress-bar-bg{width:100%;background:#dbdbdb;border-radius:4px;height:6px;overflow:hidden;margin-top:6px}
.progress-bar-fill{width:0%;height:100%;background:#0095f6;transition:width 0.2s}

/* Bottom Nav Instagram Style */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;background:#ffffff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;height:50px;z-index:20}
