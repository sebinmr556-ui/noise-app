<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noise</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
:root{--bg:#FFFAFC;--ink:#262626;--muted:#8e8e8e;--line:#f0e6eb;--pink:#fc6076;--orange:#ff9a44}
body{background:var(--bg);color:var(--ink);display:flex;justify-content:center;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app-container{width:100%;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px}
.header{height:60px;padding:0 18px;background:var(--bg);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.app-logo{height:40px;width:130px}
.header-right{display:flex;align-items:center;gap:12px}
.login-btn{background:var(--ink);color:#fff;border:0;padding:8px 15px;border-radius:22px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.google-g{font-weight:700;font-size:16px;color:#fff}
.page-section{display:none;padding:15px 15px 25px;max-width:600px;margin:0 auto;animation:fadeIn .25s}
.page-section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.post-card{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:18px;overflow:hidden;box-shadow:0 4px 15px #00000008}
.post-header{display:flex;align-items:center;padding:12px 15px;gap:11px}
.avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--orange)}
.user-info h4{font-size:14px}.user-info p{font-size:11px;color:var(--muted)}
.post-image{width:100%;max-height:500px;object-fit:cover;display:block}
.post-actions{padding:10px 15px;display:flex;gap:15px}
.action-btn{background:none;border:0;font-size:25px;color:var(--ink);line-height:1}
.action-btn.liked{color:var(--pink)}
.post-caption{padding:0 15px 15px;font-size:13px;overflow-wrap:anywhere}
.post-caption strong{margin-right:5px}
.search-box,.upload-form input,.upload-form textarea,.profile-form input{width:100%;padding:12px;border:1px solid #dbdbdb;border-radius:9px;background:white;font-size:14px;outline:none;margin-bottom:13px}
.upload-area{width:100%;min-height:220px;background:white;border:2px dashed #dbdbdb;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;margin-bottom:16px;padding:15px;text-align:center;cursor:pointer}
.upload-area img{max-width:100%;max-height:300px;border-radius:10px;object-fit:contain}
.btn-primary{width:100%;padding:12px;background:var(--ink);color:white;border:0;border-radius:9px;font-size:15px;font-weight:600}
#upload-progress-container{display:none;margin-bottom:13px;background:#f8eaf0;border-radius:10px;padding:12px;text-align:center}
.progress-bar-bg{width:100%;background:#e0d0d8;border-radius:8px;height:10px;overflow:hidden;margin-top:8px}
.progress-bar-fill{width:0%;height:100%;background:var(--pink);transition:width 0.2s ease}
.profile-header{display:flex;flex-direction:column;align-items:center;margin:8px 0 25px}
.profile-pic-container{position:relative;margin-bottom:12px;width:100px;height:100px}
.profile-pic{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--orange);background:#f0f2f5}
.login-warning{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;text-align:center;padding:15px}
.login-warning h3{margin-bottom:9px}.login-warning p{color:var(--muted);font-size:14px;margin-bottom:16px;max-width:300px}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav-item{background:none;border:0;display:flex;align-items:center;justify-content:center;width:44px;height:42px;border-radius:12px}
.nav-item svg{width:25px;height:25px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active svg{stroke:var(--pink);fill:#fc60761a}
@media(min-width:768px){.app-container{max-width:600px;border-left:1px solid var(--line);border-right:1px solid var(--line)}.header{padding:0 18px}.bottom-nav{max-width:600px;left:50%;transform:translateX(-50%);border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:18px 18px 0 0}}
</style>
</head>
<body>
<div class="app-container">
<header class="header">
  <div class="logo-container">
    <svg viewBox="0 0 130 40" class="app-logo" role="img" aria-label="Noise">
      <path d="M5 20 L10 20 L15 10 L20 30 L25 5 L30 25 L35 20 L40 20" stroke="#ff9a44" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="28" font-size="24" font-weight="600" fill="#262626">Noise</text>
    </svg>
  </div>
  <div class="header-right">
    <button id="top-login-btn" class="login-btn" type="button" onclick="signInWithGoogle()"><span class="google-g">G</span> Sign In</button>
    <button id="signout-btn" class="login-btn" type="button" onclick="signOutUser()" style="display:none">Sign Out</button>
  </div>
</header>

<main id="home-page" class="page-section active">
  <div id="firestore-posts"></div>
</main>

<main id="search-page" class="page-section">
  <input id="search-input" type="search" class="search-box" placeholder="Search Noise..." aria-label="Search Noise">
  <div id="search-results">
    <div class="trending-item" style="display:flex;align-items:center;gap:13px;padding:11px;background:white;border:1px solid var(--line);border-radius:11px"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=100&h=100&fit=crop" style="width:50px;height:50px;object-fit:cover;border-radius:8px" alt="Retro gaming"><div><h4>#RetroVibes</h4><p style="font-size:12px;color:var(--muted)">24.5K Posts</p></div></div>
  </div>
</main>

<main id="login-warning-page" class="page-section">
  <div class="login-warning"><h3>Please Sign In</h3><p>You need to sign in with your Google account to access this feature.</p><button class="login-btn" type="button" onclick="signInWithGoogle()">G &nbsp; Sign In with Google</button></div>
</main>

<main id="upload-page" class="page-section">
  <h3 style="font-size:18px;margin:3px 0 15px">Create a post</h3>
  <label class="upload-area" for="post-image-input" id="upload-area"><span style="font-size:34px">＋</span><strong>Click to upload a photo</strong><span style="font-size:12px">Choose an image from your device</span></label>
  <input id="post-image-input" type="file" accept="image/*" hidden>
  <div class="upload-form">
    <textarea id="post-caption-input" rows="3" placeholder="Write a caption..." style="width:100%;padding:12px;border:1px solid #dbdbdb;border-radius:9px;margin-bottom:13px;resize:vertical"></textarea>
    <div id="upload-progress-container">
      <span id="progress-text" style="font-size:13px;font-weight:600;color:var(--pink)">Uploading... 0%</span>
      <div class="progress-bar-bg"><div id="progress-bar-fill" class="progress-bar-fill"></div></div>
    </div>
    <button id="share-post-btn" class="btn-primary" type="button" onclick="sharePost()">Share Post</button>
  </div>
</main>

<main id="profile-page" class="page-section">
  <div class="profile-header">
    <div class="profile-pic-container"><img src="https://ui-avatars.com/api/?name=User&background=fc6076&color=fff" id="main-profile-pic" class="profile-pic" alt="Profile photo"></div>
    <h3 id="profile-heading">Your Profile</h3><p id="profile-email" style="font-size:12px;color:#8e8e8e;margin-top:3px"></p>
  </div>
  <form class="upload-form profile-form" id="profile-form" onsubmit="event.preventDefault(); alert('Profile updated successfully!');">
    <label for="prof-name" style="display:block;font-size:13px;margin:0 0 6px">Full Name</label><input type="text" id="prof-name" value="User">
    <label for="prof-username" style="display:block;font-size:13px;margin:0 0 6px">Username</label><input type="text" id="prof-username" value="user_name">
    <button class="btn-primary" type="submit">Save Profile</button>
  </form>
</main>

<nav class="bottom-nav" aria-label="Main navigation">
  <button class="nav-item active" type="button" aria-label="Home" onclick="openPage('home-page',this)"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></button>
  <button class="nav-item" type="button" aria-label="Search" onclick="openPage('search-page',this)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
  <button class="nav-item" type="button" aria-label="Upload" onclick="openPage('upload-page',this)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></button>
  <button class="nav-item" type="button" aria-label="Profile" onclick="openPage('profile-page',this)"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5xXw2IYI-6Ica2aH8rdw5mhKGDmI4zJ0",
  authDomain: "noise-app-ec4fe.firebaseapp.com",
  projectId: "noise-app-ec4fe",
  storageBucket: "noise-app-ec4fe.firebasestorage.app",
  messagingSenderId: "1066128501632",
  appId: "1:1066128501632:web:cb9f9cb63d3464b7f3af65",
  measurementId: "G-45Z3CRMQC2"
};

let auth = null;
let db = null;
let firebaseReady = false;

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);
  firebaseReady = true;
  onAuthStateChanged(auth, user => {
    if (user) applySignedInUser(user);
    else applySignedOutState();
  });
} catch (error) {
  console.error("Firebase initialization failed:", error);
}

let isLoggedIn = false;
let chosenPostImage = "";
let currentUser = null;
const defaultAvatar = "https://ui-avatars.com/api/?name=User&background=fc6076&color=fff";
const $ = id => document.getElementById(id);

window.openPage = function(pageId, navElement) {
  if (!isLoggedIn && ["upload-page","profile-page"].includes(pageId)) {
    pageId = "login-warning-page";
  }
  document.querySelectorAll(".page-section").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  $(pageId).classList.add("active");
  if (navElement) navElement.classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
};

window.signInWithGoogle = async function() {
  if (!firebaseReady || !auth) {
    alert("Google Sign In is not configured yet.");
    return;
  }
  try {
    const result = await signInWithPopup(auth, new GoogleAuthProvider());
    applySignedInUser(result.user);
  } catch (error) {
    console.error(error);
    alert("Sign-in was not completed: " + (error.message || "Please try again."));
  }
};

window.signOutUser = async function() {
  if (auth && firebaseReady) {
    try { await signOut(auth); } catch (error) { return; }
  }
  applySignedOutState();
  openPage("home-page",document.querySelectorAll(".nav-item")[0]);
};

function applySignedInUser(user) {
  currentUser = user;
  isLoggedIn = true;
  $("top-login-btn").style.display = "none";
  $("signout-btn").style.display = "inline-flex";
  const photo = user.photoURL || defaultAvatar;
  $("main-profile-pic").src = photo;
  $("prof-name").value = user.displayName || "New User";
  $("prof-username").value = (user.displayName || "user").toLowerCase().replace(/\s+/g,"_");
  $("profile-email").textContent = user.email || "";
  $("profile-heading").textContent = user.displayName || "Your Profile";
  openPage("home-page",document.querySelectorAll(".nav-item")[0]);
}

function applySignedOutState() {
  currentUser = null;
  isLoggedIn = false;
  $("top-login-btn").style.display = "inline-flex";
  $("signout-btn").style.display = "none";
  $("main-profile-pic").src = defaultAvatar;
}

$("post-image-input").addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    chosenPostImage = e.target.result;
    $("upload-area").innerHTML = `<img src="${chosenPostImage}" alt="Selected post image" style="max-width:100%;max-height:300px;border-radius:10px;object-fit:contain"><span>Tap to change photo</span>`;
  };
  reader.readAsDataURL(file);
});

window.sharePost = async function() {
  if (!isLoggedIn) { openPage("login-warning-page",null); return; }
  if (!chosenPostImage) { alert("Please choose a photo first."); return; }
  
  const caption = $("post-caption-input").value.trim();
  const safeName = $("prof-username").value.trim() || "user";
  const avatarUrl = $("main-profile-pic").src;

  const progressContainer = $("upload-progress-container");
  const progressBarFill = $("progress-bar-fill");
  const progressText = $("progress-text");
  const shareBtn = $("share-post-btn");

  progressContainer.style.display = "block";
  shareBtn.disabled = true;
  shareBtn.style.opacity = "0.6";

  let percent = 0;
  const interval = setInterval(() => {
    percent += 20;
    if (percent > 90) percent = 90;
    progressBarFill.style.width = percent + "%";
    progressText.textContent = `Uploading... ${percent}%`;
  }, 120);

  try {
    if (db) {
      await addDoc(collection(db, "posts"), {
        username: safeName,
        avatar: avatarUrl,
        image: chosenPostImage,
        caption: caption,
        createdAt: serverTimestamp()
      });
    }

    clearInterval(interval);
    progressBarFill.style.width = "100%";
    progressText.textContent = "Upload Complete! 100%";

    setTimeout(() => {
      progressContainer.style.display = "none";
      progressBarFill.style.width = "0%";
      shareBtn.disabled = false;
      shareBtn.style.opacity = "1";
      
      $("post-caption-input").value = "";
      chosenPostImage = "";
      $("post-image-input").value = "";
      $("upload-area").innerHTML = '<span style="font-size:34px">＋</span><strong>Click to upload a photo</strong><span style="font-size:12px">Choose an image from your device</span>';
      
      openPage("home-page",document.querySelectorAll(".nav-item")[0]);
      loadPosts();
    }, 500);

  } catch (err) {
    clearInterval(interval);
    progressContainer.style.display = "none";
    shareBtn.disabled = false;
    shareBtn.style.opacity = "1";
    console.error(err);
    alert("Failed to share post: " + err.message);
  }
};

async function loadPosts() {
  if (!db) return;
  try {
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    const querySnapshot = await getDocs(q);
    const container = $("firestore-posts");
    if(!container) return;
    container.innerHTML = "";
    
    if (querySnapshot.empty) {
      container.innerHTML = '<div style="background:white;border:1px solid var(--line);padding:25px;border-radius:12px;text-align:center;color:var(--muted);font-size:13px;margin-top:20px">No posts yet. Be the first to share one!</div>';
      return;
    }
    
    querySnapshot.forEach(docSnap => {
      const data = docSnap.data();
      const card = document.createElement("article");
      card.className = "post-card";
      
      const header = document.createElement("div"); header.className = "post-header";
      const avatar = document.createElement("img"); avatar.className = "avatar"; avatar.src = data.avatar || defaultAvatar; avatar.alt = "Profile";
      const info = document.createElement("div"); info.className = "user-info";
      const h = document.createElement("h4"); h.textContent = data.username || "user";
      const time = document.createElement("p"); time.textContent = "just now";
      info.append(h,time); header.append(avatar,info);
      
      const image = document.createElement("img"); image.className = "post-image"; image.src = data.image; image.alt = "User post";
      
      const actions = document.createElement("div"); actions.className = "post-actions";
      const like = document.createElement("button"); like.className = "action-btn like-btn"; like.textContent = "♡";
      like.addEventListener("click",()=>{like.classList.toggle("liked");like.textContent=like.classList.contains("liked")?"❤️":"♡";});
      const comment = document.createElement("button"); comment.className = "action-btn"; comment.textContent = "💬";
      actions.append(like,comment);
      
      const cap = document.createElement("div"); cap.className = "post-caption";
      const p = document.createElement("p"); const strong = document.createElement("strong"); strong.textContent = data.username || "user"; p.append(strong,document.createTextNode(" "+(data.caption || ""))); cap.append(p);
      
      card.append(header,image,actions,cap);
      container.append(card);
    });
  } catch (e) {
    console.error("Error loading posts:", e);
  }
}

window.addEventListener("DOMContentLoaded", () => {
  loadPosts();
});
</script>
</body>
</html>
